name: Assign leads to callers

# Tops every caller's queue back up to their daily target from the refined pool.
# Runs on weekday mornings in the two US time zones the team calls into, plus a
# midday top-up, so a caller who burns through their list is refilled the same day.
on:
  schedule:
    # 12:00 UTC = 08:00 ET / 07:00 CT — before the calling day starts
    - cron: "0 12 * * 1-5"
    # 17:00 UTC = 13:00 ET / 12:00 CT — midday top-up
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Top up caller queues
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository secrets must both be set." >&2
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/assign-leads")
          echo "HTTP $code"
          cat response.json
          echo
          if [ "$code" != "200" ]; then
            echo "Assignment failed." >&2
            exit 1
          fi
